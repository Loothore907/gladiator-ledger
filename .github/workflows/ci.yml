# Runs on every push and pull request. Offline: no API keys, no cost.
# Linux is the official target; Windows is checked so a judge on Windows can clone and run it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run pytest -v

  readme:
    name: README commands, clean clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # includes loading every step from the sealed records once (about a minute) for the process and route commands
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - name: Every README command works with no API keys
        shell: bash
        run: |
          set -euo pipefail
          uv run ledger recommend --suite small-tier --budget 0.05
          uv run ledger recommend --suite small-tier --budget 0.005
          uv run ledger recommend --suite mid-tier --budget 0.1
          uv run ledger recommend refund-queue --budget 0.05
          for q in best_under_budget hazard_profile beat_cycles beats promotion stale_results sources; do  # the rest need a model or a pair
            uv run ledger ask "$q" --param test_id=gladiator/refund-queue --param budget=0.05 > /dev/null
          done
          uv run ledger ask hazard_profile --json > /dev/null
          # a question about a pair, with the pair given the way the README gives it; and the store asked directly
          uv run ledger ask head_to_head --param a="haiku 5.5" --param b=deepseek-v4.1 > /dev/null
          uv run ledger cypher "MATCH (m:Model)<-[:BY]-(a:Attempt) RETURN m.name AS model, count(a) AS attempts ORDER BY attempts DESC" | grep -q "claude-haiku-5-5"
          uv run ledger cypher "MATCH (n) UNWIND labels(n) AS kind RETURN kind, count(*) AS nodes ORDER BY kind" > /dev/null
          uv run ledger verify
          uv run ledger opponents "haiku 5.5" --open-only > /dev/null
          uv run ledger flows "an agent that handles refund requests for damaged orders" | grep -q "gladiator/refund-queue"
          # The whole record, live races included: these answers move as races are imported, so the commands only
          # have to run. Nothing here may depend on what they say.
          uv run ledger verdict refund-queue --a "haiku 5.5" --b deepseek-v4.1 > /dev/null
          uv run ledger verdict refund-queue --a "haiku 5.5" --b minimax-m3.1 > /dev/null
          uv run ledger verdict refund-queue --a anthropic:claude-haiku-5-5 --b openrouter:minimax/minimax-m3.1-flash > /dev/null
          uv run ledger verdict incident-triage --a "haiku 5.5" --b minimax-m3.1 > /dev/null
          uv run ledger spec refund-queue --a "haiku 5.5" --b deepseek-v4.1 > /dev/null
          # How they got there: the first of these loads every step from the sealed records into a local store
          uv run ledger process refund-queue --a "haiku 5.5" --b deepseek-v4.1 --cypher > /dev/null
          uv run ledger process incident-triage > /dev/null
          uv run ledger route refund-queue --a "haiku 5.5" --b deepseek-v4.1 > /dev/null
          uv run ledger verdict refund-queue --a "haiku 5.5" --b deepseek-v4.1 --check decided-before-seeing=minor > /dev/null
          uv run ledger ask what_decisions_need --param version_key=gladiator/refund-queue@2.2.0:c6373a0385f6 > /dev/null
      - name: The README's figures are what the record gave at the moment it names
        shell: bash
        run: |
          set -euo pipefail
          # Every figure the README prints is the record as it stood at one moment (--until). A race run later
          # never joins that set, so these hold however many are imported; a record added from before that moment
          # changes them in a reviewed pull request, together with the README.
          fixed() { uv run ledger "$@" --until 2026-11-26T05:00; }
          pair=(--a "haiku 5.5" --b deepseek-v4.1)
          fixed spec refund-queue "${pair[@]}" --report cost > /dev/null
          fixed spec refund-queue "${pair[@]}" --report evidence > /dev/null
          spec=$(fixed spec refund-queue "${pair[@]}")
          grep -qF "## 2. Blueprint" <<< "$spec"
          # Step 3, as printed
          shown=$(fixed verdict refund-queue "${pair[@]}")
          for want in \
            "the record up to 2026-11-26 05:00 UTC" \
            "Played under: standard difficulty, budget scoring, low effort, a \$0.12 limit per attempt, an output limit of 4096 tokens, a 180-second limit per call." \
            "Use anthropic:claude-haiku-5-5: both are fit for this task and it did it better." \
            "claude-haiku-5-5: fit. Right result in 80 of 81 attempts (99%; bar 80%); 68 of them also followed the process" \
            "deepseek-v4.1-flash-1017: fit. Right result in 95 of 95 attempts (100%; bar 80%); 30 of them also followed the process" \
            "tolerated: acted without reading (minor) in 65 of 95" \
            "Head to head: anthropic:claude-haiku-5-5 does this task better" \
            "43 judged pairs" "claude-haiku-5-5 won 37," "deepseek-v4.1-flash-1017 won 6, 0 tied" \
            "0 tied. Between two equally good models a split this lopsided would happen less than 0.1% of the time." \
            "decided: 28 on process (both got the right result, only the winner ran clean), 15 on efficiency" \
            "Both got the right result in all 43 scenarios, so every one was decided on process or efficiency" \
            "anthropic:claude-haiku-5-5 won 37: 28 on process (both got the right result, only it ran clean), 9 on efficiency"; do
            grep -qF "$want" <<< "$shown" || { echo "README step 3 is no longer what the command prints: $want"; exit 1; }
          done
          # the reader's own level for one fault turns the answer round, and so does a business's tolerance
          strict=$(fixed verdict refund-queue "${pair[@]}" --unforgivable "acted without reading")
          grep -qF "Neither is fit for this task." <<< "$strict"
          grep -qF "because: acted without reading (unforgivable) in 65 of 95 attempts" <<< "$strict"
          # "How they got there": the counts from the steps, the grader's own beside them, a reader's level, a route
          worked=$(fixed process refund-queue "${pair[@]}")
          for want in \
            "each refund request refers to its order (order_id); each refund request refers to its customer (order_id > customer_id)" \
            "anthropic:claude-haiku-5-5                          81       18     40            18              6" \
            "openrouter:deepseek/deepseek-v4.1-flash-1017        95       77    241            77             12" \
            "anthropic:claude-haiku-5-5                          81       12     27            12              0                  12" \
            "openrouter:deepseek/deepseek-v4.1-flash-1017        95       65    156            65              0                  65"; do
            grep -qF "$want" <<< "$worked" || { echo "README 'How they got there' is no longer what the command prints: $want"; exit 1; }
          done
          own=$(fixed verdict refund-queue "${pair[@]}" --check decided-before-seeing=serious)
          grep -qF "Neither is fit for this task." <<< "$own"
          grep -qF "because: decided before seeing a record it depends on (your check) (serious) in 18 of 81 attempts, over the 10% allowed" <<< "$own"
          grep -qF "because: decided before seeing a record it depends on (your check) (serious) in 77 of 95 attempts, over the 10% allowed" <<< "$own"
          two=$(fixed route refund-queue "${pair[@]}" --scenario 2)
          for want in \
            "Scenario 2 of 43: the same world, two routes  (20261122-070649-4239f8/refund-queue/2, won by A)" \
            "B  deny_request at step 8, had seen order, NOT customer CUS-003" \
            "REQ-0002  <- decided differently" \
            "Decided differently: 1 of 12 items. Decided before seeing a record the item depends on: A 0, B 4."; do
            grep -qF "$want" <<< "$two" || { echo "README's two routes are no longer what the command prints: $want"; exit 1; }
          done
          # "The idea in one table": task, judged pairs, scenarios won (Haiku, DeepSeek), share of attempts with the
          # right result (Haiku, DeepSeek), then how the answer starts for one person and for a business
          while IFS='|' read -r task pairs won_a won_b right_a right_b personal business; do
            row=$(fixed verdict "$task" "${pair[@]}")
            grep -qF "$pairs judged pairs" <<< "$row" &&
              grep -qF "claude-haiku-5-5 won $won_a, openrouter:deepseek/deepseek-v4.1-flash-1017 won $won_b," <<< "$row" &&
              grep -qE "claude-haiku-5-5: .*attempts \($right_a%; bar 80%\)" <<< "$row" &&
              grep -qE "deepseek-v4.1-flash-1017: .*attempts \($right_b%; bar 80%\)" <<< "$row" &&
              grep -qF "$personal" <<< "$row" &&
              grep -qF "$business" <<< "$(fixed verdict "$task" "${pair[@]}" --profile enterprise)" ||
              { echo "The README's table is no longer what the record gives for $task"; exit 1; }
          done <<'ROWS'
          refund-queue|43|37|6|99|100|Use anthropic:claude-haiku-5-5: both are fit for this task and it did it better.|Neither is fit for this task.
          incident-triage|41|30|11|91|97|Use anthropic:claude-haiku-5-5: both are fit for this task and it did it better.|Not settled yet whether either is fit for this task: for anthropic:claude-haiku-5-5, it is short of the bar so far, on 80 attempts
          access-review|41|19|22|98|99|Both are fit for this task, and the matches show no winner between them.|Use openrouter:deepseek/deepseek-v4.1-flash-1017: it is the only one of the two fit for this task.
          inventory-transfer|41|20|19|87|95|Whether anthropic:claude-haiku-5-5 is fit is not settled yet: it meets the bar so far, on 79 attempts.|anthropic:claude-haiku-5-5 is not fit for this task. Whether openrouter:deepseek/deepseek-v4.1-flash-1017 is fit is not settled yet: it is short of the bar so far, on 93 attempts.
          ROWS
      - name: Rebuilding the store from the shipped records gives the same answers
        shell: bash
        run: |
          set -euo pipefail
          uv run ledger build --records data/records --validations data/validations --scores data/epoch --store rebuilt.rl
          uv run ledger recommend --suite small-tier --budget 0.05 > shipped.txt
          uv run ledger recommend --suite small-tier --budget 0.05 --store rebuilt.rl > rebuilt.txt
          diff shipped.txt rebuilt.txt
          rm -f rebuilt.rl shipped.txt rebuilt.txt
      - name: The checkout is untouched (nothing ships dirty)
        shell: bash
        run: git status --porcelain && test -z "$(git status --porcelain)"

  demo-page:
    name: Demo page matches the command line
    runs-on: ubuntu-latest
    # The check clicks through every pair of models on every workflow, and each verdict reads more as the record
    # grows: about 7 minutes on Nov 26 (49 matches), after up to 5 to install the browser. 15 was getting close.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the browser used for the check
        working-directory: site
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: The page gives the same verdicts, specs, flow searches and opponents as the command line
        run: node site/check.cjs

  live-record:
    name: A page behind the record catches up from the live record
    runs-on: ubuntu-latest
    # The real service (`ledger serve`) beside a stand-in runner, and the page as it was published before the last
    # four records: they are played over again, and the page must end up as the page published after them.
    # About a minute to build the service's store, then about three for the browser.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the browser used for the check
        working-directory: site
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: A race the live record takes in is in the page's graph and its verdict, as the command line has it
        run: node site/check-live.cjs

  container:
    name: Live record container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ledger-live:ci .
      - name: The service builds its store on a freshly mounted volume, answers, reopens it, and never runs as root
        run: |
          docker volume create ledger_state
          docker run -d --name live --memory 1g -v ledger_state:/data -p 8080:8080 ledger-live:ci \
            serve --host 0.0.0.0 --port 8080 --state /data --data /app/data --origin https://ledger.example
          for i in $(seq 1 60); do curl -sf localhost:8080/health > /dev/null && break || sleep 3; done
          curl -sf localhost:8080/health | python3 -c "import json,sys; h=json.load(sys.stdin); assert h['ok'] and h['steps'] > 0 and not h['refused'] and not h['problem'], h; print(h)"
          # it holds exactly the sealed records it was built with
          held=$(curl -sf localhost:8080/runs | python3 -c "import json,sys; print(len(json.load(sys.stdin)['runs']))")
          test "$held" = "$(find data/records -name record.json | wc -l)"
          # the service itself runs as the unprivileged user, whatever started the container, and owns its state
          test "$(docker exec live stat -c %U /proc/1)" = "ledger"
          test "$(docker exec live stat -c %U /data/store)" = "ledger"
          # a page that is allowed may read it from a browser; any other gets no permission
          curl -sf -D - -o /dev/null -H "Origin: https://ledger.example" localhost:8080/runs | grep -qi "access-control-allow-origin: https://ledger.example"
          ! curl -sf -D - -o /dev/null -H "Origin: https://elsewhere.example" localhost:8080/runs | grep -qi "access-control-allow-origin"
          # started again, it reopens the store it left instead of building it again
          docker restart live
          for i in $(seq 1 30); do curl -sf localhost:8080/health > /dev/null && break || sleep 2; done
          docker logs live 2>&1 | grep -q "store reopened: $held records"
          test "$(docker inspect live --format '{{.State.OOMKilled}}')" = "false"
          docker rm -f live

  publish:
    name: Publish the container image
    # Only what main's checks passed is published: the hosting rule (docs/DEPLOYMENT.md in gladiator-core).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, readme, demo-page, live-record, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/loothore907/gladiator-ledger
    steps:
      - uses: actions/checkout@v7
      - name: Build the image, labelled with the commit it came from
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" .
      - name: The image about to be published checks every sealed record it carries
        run: docker run --rm "$IMAGE:$GITHUB_SHA" verify --data /app/data
      - name: Push to GitHub's container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
