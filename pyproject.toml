[project]
name = "gladiator-ledger"
version = "0.1.0"
description = "Which of two AI models does this task better, how sure is that, and what to build: head-to-head evidence in a Relate graph."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.3,<3",
    "relate-db",
]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
