[project]
name = "gladiator-ledger"
version = "0.1.0"
description = "Load Gladiator run records into a Relate graph and ask which model wins a workflow under a budget."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["relate-db"]

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
